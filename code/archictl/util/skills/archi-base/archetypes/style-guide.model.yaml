    TechnologyInterface:
      Technology Interface:
        id: id-sg-r4-tech-iface-generic-00001
        doc: Generic archetype for a technology interface — an access point through which a technology service is made available (ArchiMate §11.3).
      Solution VM NIC:
        id: id-sg-r4-tech-iface-nic-00002
        doc: |-
          Example: NIC attached to Solution VM. Access point connecting the VM Node to its subnet.
          Azure Resource Type: Microsoft.Network/networkInterfaces
          Composed within: Solution VM (parent Node)
          Associated to: Solution Subnet (CommunicationNetwork)
      Solution Public IP:
        id: id-sg-r4-tech-iface-pip-00003
        doc: |-
          Example: Public IP address bound to Solution VM NIC. External-facing address through which the VM service is reachable.
          Azure Resource Type: Microsoft.Network/publicIPAddresses
          Associated to: Solution VM NIC (TechnologyInterface)
    TechnologyCollaboration:
      Azure Virtual Machine Scale Set: id-eef233fa248a4a3eb7fd1e544471b668
    SystemSoftware:
      Azure Control Plane - VMSS Driving Software:
        id: id-76487204687b49cfbcbe1d2a74aa7c0c
        doc: This component, encapsulated somewhere in Azure and transparent to the user, implements the behavior managing the number of nodes, rules evaluation and triggering and so on.
