  technology/:
    TechnologyService:
      Technology Service: id-4f20b1364b5a47f9968ed2bd5796a44c
      Azure Container Registry:
        id: id-2c818830e9394ebba8f67ca0cdba8be1
        doc: |
          Technology Managed Service Offered By Microsoft Azure
      Software Defined Infrastructure Managed Virtual Service Component: id-720d3c5e20cd40f9b3cea10b4ab51eef
      Azure Resource Group:
        id: id-sg-r3-tech-rgsvc-00001
        doc: |-
          Microsoft Azure ARM Resource Group platform capability (provider responsibility).
          Behaviour: cascade delete of all contained resources, RBAC scope boundary, Azure Policy evaluation scope, regional affinity enforcement.
          This is what the organisation buys — the platform feature. Specific instances are ApplicationComponents.
      Azure Virtual NIC Service:
        id: id-sg-r4-tech-nicsvc-00001
        doc: |-
          Microsoft Azure virtual NIC platform capability (provider responsibility).
          Provides virtual network interface cards and public IP allocation as a managed service.
          Specific NIC and IP instances are TechnologyInterfaces composed within their parent VM Node.
      Azure Virtual Machines Scale Set:
        id: id-b6c6c571f8654f5cbf52c650c592833b
        doc: Azure Virtual Machines Scale Set (Technology Service)
    CommunicationNetwork:
      Software Defined Network: id-e5fbb2417f734450b6d5aded02dde8d3
