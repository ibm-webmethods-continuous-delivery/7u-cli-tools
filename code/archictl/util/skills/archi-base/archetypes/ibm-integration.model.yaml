      Hybrid Application & Protocol Integration: id-ibm-cap-ace-01
      API Governance & Security Gateway: id-ibm-cap-apic-01
  business/: {}
  application/:
    ApplicationComponent:
      Core Payment IBM MQ Queue Manager:
        id: id-ibm-app-mq-qmgr-01
