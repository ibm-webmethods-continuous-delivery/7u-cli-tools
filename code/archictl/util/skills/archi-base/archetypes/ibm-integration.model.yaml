      - id-ibm-rel-flow-realizes-svc Payment Transformation ACE Flow > Payment Validation & Routing Service
      - id-ibm-rel-api-realizes-svc Corporate Payment Managed API > Payment REST Endpoint Service
    Composition:
      - id-ibm-rel-ocp-comp-mq CP4I OpenShift Cluster > IBM MQ Runtime Operator
      - id-ibm-rel-ocp-comp-ace CP4I OpenShift Cluster > IBM App Connect Integration Server Runtime
      - id-ibm-rel-ocp-comp-apic CP4I OpenShift Cluster > IBM DataPower / APIC Gateway Engine
    Serving:
      - id-ibm-rel-mq-serves-qmgr IBM MQ Runtime Operator > Core Payment IBM MQ Queue Manager
      - id-ibm-rel-ace-serves-flow IBM App Connect Integration Server Runtime > Payment Transformation ACE Flow
      - id-ibm-rel-apic-serves-api IBM DataPower / APIC Gateway Engine > Corporate Payment Managed API
      - id-ibm-rel-apic-serves-ace Payment REST Endpoint Service > Payment Transformation ACE Flow
      - id-ibm-rel-ace-serves-mq Payment Validation & Routing Service > Core Payment IBM MQ Queue Manager
  diagrams/:
    ArchimateDiagramModel:
