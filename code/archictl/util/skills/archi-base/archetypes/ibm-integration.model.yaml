      Payment Transformation ACE Flow:
        id: id-ibm-app-ace-flow-01
        doc: App Connect Enterprise message flow performing ISO20022 transformation and validation.
      Corporate Payment Managed API:
        id: id-ibm-app-apic-api-01
        doc: API Connect published REST API enforcing OAuth2 and rate limits.
    ApplicationService:
      Payment Request Queue Service: id-ibm-app-mq-req-svc-01
      Payment Validation & Routing Service: id-ibm-app-ace-svc-01
      Payment REST Endpoint Service: id-ibm-app-apic-svc-01
  technology/:
    Node:
      CP4I OpenShift Cluster: id-ibm-tech-ocp-node-01
    SystemSoftware:
      IBM MQ Runtime Operator: id-ibm-tech-mq-runtime-01
      IBM App Connect Integration Server Runtime: id-ibm-tech-ace-runtime-01
      IBM DataPower / APIC Gateway Engine: id-ibm-tech-apic-runtime-01
  motivation/: {}
  implementation_migration/: {}
  other/: {}
  relations/:
    Realization:
      - id-ibm-rel-mq-realizes-cap IBM MQ Runtime Operator > Enterprise Transactional Messaging
      - id-ibm-rel-ace-realizes-cap IBM App Connect Integration Server Runtime > Hybrid Application & Protocol Integration
      - id-ibm-rel-apic-realizes-cap IBM DataPower / APIC Gateway Engine > API Governance & Security Gateway
